name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          # The version the Dockerfile and mise.toml use, as in seating.
          python-version: "3.14"
      - name: Run tests with pytest
        run: |
          # make sure the pipe passes on pytest's exit code, so failures fail CI
          set -o pipefail
          # fail if coverage drops below its level when this minimum was set (74.3%),
          # and write coverage.xml for Codecov
          pytest --cov=server --cov-report=term-missing:skip-covered --cov-report=xml \
            --cov-fail-under=74 | tee pytest-coverage.txt
      # the per-file coverage report, on the run's summary page
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Server test coverage"
            echo '```'
            cat pytest-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Codecov compares coverage with main's and fails a PR that lowers it (codecov.yml)
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
