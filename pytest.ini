[pytest]
# `pytest` runs the unit tests. The accessibility audit needs Chrome and the
# frontend build, so it runs on its own: `pytest tests/a11y` (docs/a11y.md).
testpaths = tests/unit
# server/ is a package, imported from the repository root (`from server.models import db`).
pythonpath = .
# Fail on unclosed files and connections. pytest reports one found while an
# object is garbage-collected as PytestUnraisableExceptionWarning.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
