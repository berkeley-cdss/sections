[pytest]
testpaths = tests
# The app's modules import each other by bare name (`from models import db`),
# as they do when run from server/.
pythonpath = . server
# Fail on unclosed files and connections. pytest reports one found while an
# object is garbage-collected as PytestUnraisableExceptionWarning.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
